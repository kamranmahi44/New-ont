    function App() {
      // Dark Blue Theme Selection
      const [currentTheme, setCurrentTheme] = useState("midnight");
      const [wifiInfo, setWifiInfo] = useState(DEFAULT_WIFI);
      const [adminUser, setAdminUser] = useState(DEFAULT_ADMIN);
      const [devices, setDevices] = useState(INITIAL_DEVICES);
      const [searchQuery, setSearchQuery] = useState("");
      const [filterType, setFilterType] = useState("all");
      const [isScanning, setIsScanning] = useState(false);
      const [selectedDevice, setSelectedDevice] = useState(null);
      const [viewMode, setViewMode] = useState("grid");
      const [toastMessage, setToastMessage] = useState(null);
      
      // Chrome PWA Install Prompt State
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstallModal, setShowInstallModal] = useState(false);
      const [isInstalled, setIsInstalled] = useState(false);

      // Real-time Automatic Screen Size State
      const [screenSize, setScreenSize] = useState({
        width: typeof window !== 'undefined' ? window.innerWidth : 1200,
        height: typeof window !== 'undefined' ? window.innerHeight : 800,
        deviceCategory: 'Desktop'
      });

      // Update Screen Size on Resize in Real Time
      useEffect(() => {
        const handleResize = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          let cat = 'Desktop (Wide)';
          if (w < 640) cat = 'Mobile (Compact)';
          else if (w < 1024) cat = 'Tablet (Medium)';
          
          setScreenSize({ width: w, height: h, deviceCategory: cat });
        };

        handleResize();
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('orientationchange', handleResize);
        };
      }, []);

      // Listen for Chrome's beforeinstallprompt
      useEffect(() => {
        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
          // Show install button prominently
        };

        const handleAppInstalled = () => {
          setIsInstalled(true);
          setDeferredPrompt(null);
          showToast("NetAdmin Web App installed successfully!");
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        window.addEventListener('appinstalled', handleAppInstalled);

        // Check if already in standalone display mode
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
          setIsInstalled(true);
        }

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
          window.removeEventListener('appinstalled', handleAppInstalled);
        };
      }, []);

      // Android Bridge bindings
      useEffect(() => {
        window.updateDevices = (devicesJson) => {
          try {
            const parsed = typeof devicesJson === 'string' ? JSON.parse(devicesJson) : devicesJson;
            if (Array.isArray(parsed) && parsed.length > 0) {
              setDevices(parsed);
              showToast("Live devices synced from Android core");
            }
          } catch (e) {
            console.error(e);
          }
        };

        window.updateWifiInfo = (wifiJson) => {
          try {
            const parsed = typeof wifiJson === 'string' ? JSON.parse(wifiJson) : wifiJson;
            setWifiInfo(prev => ({ ...prev, ...parsed }));
          } catch (e) {
            console.error(e);
          }
        };

        window.updateAdminUser = (adminJson) => {
          try {
            const parsed = typeof adminJson === 'string' ? JSON.parse(adminJson) : adminJson;
            setAdminUser(prev => ({ ...prev, ...parsed }));
          } catch (e) {
            console.error(e);
          }
        };

        if (window.AndroidBridge && window.AndroidBridge.onDashboardReady) {
          try { window.AndroidBridge.onDashboardReady(); } catch (_) {}
        }
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Trigger Install Button action
      const handleTriggerInstall = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            showToast("Installing NetAdmin Web App...");
          }
          setDeferredPrompt(null);
        } else {
          // Open instant install instructions popup
          setShowInstallModal(true);
        }
      };

      // Device Actions
      const toggleBlockDevice = (ip) => {
        setDevices(prev => prev.map(d => {
          if (d.ip === ip) {
            const next = !d.isBlocked;
            showToast(next ? `Blocked ${d.alias || d.name} (${d.ip})` : `Restored ${d.alias || d.name}`);
            if (window.AndroidBridge && window.AndroidBridge.toggleBlockDevice) {
              window.AndroidBridge.toggleBlockDevice(ip, next);
            }
            return { ...d, isBlocked: next };
          }
          return d;
        }));
      };

      const handleRescan = () => {
        setIsScanning(true);
        showToast("Scanning local subnet 192.168.1.0/24...");
        if (window.AndroidBridge && window.AndroidBridge.rescanSubnet) {
          window.AndroidBridge.rescanSubnet();
        }
        setTimeout(() => {
          setIsScanning(false);
          showToast("Subnet scan completed");
        }, 1200);
      };

      // Filtered Devices

        return devices.filter(d => {
          const match = 
            d.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            d.alias.toLowerCase().includes(searchQuery.toLowerCase()) ||
            d.ip.includes(searchQuery) ||
            d.mac.toLowerCase().includes(searchQuery.toLowerCase()) ||
            d.vendor.toLowerCase().includes(searchQuery.toLowerCase());

          if (!match) return false;
          if (filterType === "online") return d.isOnline && !d.isBlocked;
          if (filterType === "blocked") return d.isBlocked;
          if (filterType === "laptop") return d.deviceType === "laptop";
          if (filterType === "mobile") return d.deviceType === "mobile";
          if (filterType === "iot") return d.deviceType === "iot";
          if (filterType === "media") return d.deviceType === "media" || d.deviceType === "gaming";
          return true;
        });

              </svg>
            );

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                  <span>{screenSize.deviceCategory}</span>
                  <span className="font-mono text-cyan-400">{screenSize.width}px</span>
                </div>

                {/* Dark Blue Theme Template Selector */}
                <select
                  value={currentTheme}
                  onChange={(e) => setCurrentTheme(e.target.value)}
                  className="bg-deepNavy-900 border border-deepNavy-700 text-cyan-300 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-cyan-400"
                  title="Switch Dark Blue Template"
                >
                  <option value="midnight">Theme: Midnight</option>
                  <option value="cobalt">Theme: Cobalt</option>
                  <option value="sapphire">Theme: Sapphire</option>
                </select>

                {/* CHROME APP INSTALL BUTTON */}
                <button
                  onClick={handleTriggerInstall}
                  className="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold shadow-lg shadow-cyan-500/25 flex items-center gap-1.5 transition active:scale-95"
                  title="Install NetAdmin Web App via Chrome"
                >
                  {/* Chrome Logo / Install Icon */}
                  <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5h2v5h-2zm1-8.5c-.83 0-1.5-.67-1.5-1.5S11.17 5 12 5s1.5.67 1.5 1.5S12.83 8 12 8z"/>
                  </svg>
                  <span>{isInstalled ? "Installed" : "Install App"}</span>
                </button>

                {/* Rescan Button */}
                <button
                  onClick={handleRescan}
                  disabled={isScanning}
                  className="px-3 py-1.5 rounded-xl bg-deepNavy-800 hover:bg-deepNavy-700 text-slate-200 text-xs font-semibold border border-deepNavy-600 flex items-center gap-1.5 transition active:scale-95 disabled:opacity-50"
                >
                  <svg className={`w-3.5 h-3.5 text-cyan-400 ${isScanning ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  <span className="hidden sm:inline">Scan</span>
                </button>

                {/* Admin Chip */}
                <div className="flex items-center gap-2 bg-deepNavy-900 border border-deepNavy-700 px-2.5 py-1 rounded-xl">
                  <img
                    src={adminUser.avatarUrl || "https://avatars.githubusercontent.com/u/583231?v=4"}
                    alt="GitHub Admin"
                    className="w-5 h-5 rounded-full border border-cyan-400"
                  />
                  <span className="text-xs font-semibold text-white hidden md:inline">@{adminUser.login}</span>
                </div>

              </div>

            </div>
          </header>

          {/* Main Container - Auto responsive sizing */}
          <main className="max-w-7xl mx-auto px-4 py-5 w-full space-y-6">

            {/* PWA Chrome Installation Banner (shows when not installed) */}
            {!isInstalled && (
              <div className="dark-blue-card rounded-2xl p-4 border border-cyan-500/40 bg-gradient-to-r from-deepNavy-900 via-deepNavy-850 to-blue-950/40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div className="flex items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-cyan-950/80 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0">
                    <svg className="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                      <span>Install NetAdmin PWA on Chrome</span>
                      <span className="text-[10px] bg-cyan-900/60 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-700">Instant Access</span>
                    </h2>
                    <p className="text-xs text-slate-300 mt-0.5">
                      Launch as a standalone native-feeling desktop & mobile app with offline discovery and real-time WiFi controls.
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 self-end sm:self-center">
                  <button
                    onClick={handleTriggerInstall}
                    className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs shadow-lg shadow-cyan-500/30 flex items-center gap-2 transition active:scale-95"
                  >
                    <span>Install Web App</span>
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                  </button>
                </div>
              </div>
            )}

            {/* Metric Stats Grid (Auto adjusts: 2 cols on mobile, 4 on desktop) */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
              <div className="dark-blue-card rounded-2xl p-4">
                <div className="text-slate-400 text-xs font-semibold">Total Devices</div>
                <div className="text-2xl md:text-3xl font-bold text-white mt-1">{devices.length}</div>
                <div className="text-[11px] text-cyan-400 mt-2 font-mono">192.168.1.0/24</div>
              </div>
              <div className="dark-blue-card rounded-2xl p-4">
                <div className="text-slate-400 text-xs font-semibold">Active & Online</div>
                <div className="text-2xl md:text-3xl font-bold text-emerald-400 mt-1">
                  {devices.filter(d => d.isOnline && !d.isBlocked).length}
                </div>
                <div className="text-[11px] text-emerald-400 mt-2 flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>
                  Nodes reachable
                </div>
              </div>
              <div className="dark-blue-card rounded-2xl p-4">
                <div className="text-slate-400 text-xs font-semibold">Blocked Devices</div>
                <div className="text-2xl md:text-3xl font-bold text-rose-400 mt-1">
                  {devices.filter(d => d.isBlocked).length}
                </div>
                <div className="text-[11px] text-slate-400 mt-2">ACL rules enforced</div>
              </div>
              <div className="dark-blue-card rounded-2xl p-4">
                <div className="text-slate-400 text-xs font-semibold">Gateway Latency</div>
                <div className="text-2xl md:text-3xl font-bold text-cyan-400 mt-1">2 ms</div>
                <div className="text-[11px] text-slate-400 mt-2">Link: {wifiInfo.linkSpeed} Mbps</div>
              </div>
            </div>

            {/* Search & Category Filter Controls */}
            <div className="space-y-3">
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <div className="relative flex-1">
                  <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search device by name, IP, MAC address or vendor..."
                    className="w-full bg-deepNavy-900 border border-deepNavy-700 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition"
                  />
                </div>

                <div className="flex items-center gap-1 bg-deepNavy-900 border border-deepNavy-700 p-1 rounded-xl self-end sm:self-auto">
                  <button
                    onClick={() => setViewMode("grid")}
                    className={`px-3 py-1 rounded-lg text-xs font-semibold ${viewMode === "grid" ? "bg-cyan-600 text-white" : "text-slate-400 hover:text-white"}`}
                  >
                    Grid
                  </button>
                  <button
                    onClick={() => setViewMode("table")}
                    className={`px-3 py-1 rounded-lg text-xs font-semibold ${viewMode === "table" ? "bg-cyan-600 text-white" : "text-slate-400 hover:text-white"}`}
                  >
                    Table
                  </button>
                </div>
              </div>

              {/* Filter Chips */}
              <div className="flex items-center gap-1.5 overflow-x-auto pb-1 custom-scroll">
                {[
                  { id: "all", label: `All (${devices.length})` },
                  { id: "online", label: "Online" },
                  { id: "blocked", label: "Blocked" },
                  { id: "laptop", label: "Computers / PCs" },
                  { id: "mobile", label: "Mobile Phones" },
                  { id: "iot", label: "Smart Home / IoT" },
                  { id: "media", label: "Media & TV" }
                ].map(chip => (
                  <button
                    key={chip.id}
                    onClick={() => setFilterType(chip.id)}
                    className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition border ${
                      filterType === chip.id
                        ? "bg-cyan-500/20 text-cyan-300 border-cyan-400"
                        : "bg-deepNavy-900 text-slate-400 border-deepNavy-700 hover:text-white"
                    }`}
                  >
                    {chip.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Devices Grid - Responsive: 1 col on mobile, 2 on tablet, 3-4 on desktop */}
            {viewMode === "grid" ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {filteredDevices.map(dev => (
                  <div
                    key={dev.id || dev.ip}
                    className={`dark-blue-card rounded-2xl p-4 transition duration-200 border ${
                      dev.isBlocked ? 'border-rose-700/60 bg-rose-950/20' : 'border-deepNavy-700/80 hover:border-cyan-500/50'
                    }`}
                  >
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-deepNavy-850 flex items-center justify-center border border-deepNavy-700">
                          {getDeviceIcon(dev.deviceType)}
                        </div>
                        <div>
                          <div className="text-sm font-bold text-white truncate max-w-[140px]">
                            {dev.alias || dev.name}
                          </div>
                          <div className="text-[11px] text-slate-400 truncate max-w-[140px]">{dev.vendor}</div>
                        </div>
                      </div>

                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${
                        dev.isBlocked ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'
                      }`}>
                        {dev.isBlocked ? 'Blocked' : 'Online'}
                      </span>
                    </div>

                    <div className="mt-3 pt-3 border-t border-deepNavy-700/60 space-y-1 text-xs">
                      <div className="flex justify-between">
                        <span className="text-slate-400">IP:</span>
                        <span className="font-mono text-cyan-300 font-bold">{dev.ip}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">MAC:</span>
                        <span className="font-mono text-slate-300 text-[11px]">{dev.mac}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Latency:</span>
                        <span className="font-mono text-emerald-400">{dev.pingMs ? `${dev.pingMs} ms` : 'N/A'}</span>
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-deepNavy-700/60 flex items-center justify-between gap-2">
                      <button
                        onClick={() => setSelectedDevice(dev)}
                        className="px-2.5 py-1.5 rounded-lg bg-deepNavy-850 hover:bg-deepNavy-800 text-slate-300 text-xs font-semibold border border-deepNavy-700"
                      >
                        Inspect
                      </button>

                      <button
                        onClick={() => toggleBlockDevice(dev.ip)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition active:scale-95 ${
                          dev.isBlocked ? 'bg-emerald-600 text-white' : 'bg-rose-900/60 text-rose-300 border border-rose-700'
                        }`}
                      >
                        {dev.isBlocked ? 'Restore' : 'Block'}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="dark-blue-card rounded-2xl overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-deepNavy-900/90 text-slate-400 border-b border-deepNavy-700">
                    <tr>
                      <th className="py-3 px-4 font-bold">Device</th>
                      <th className="py-3 px-4 font-bold">IP / MAC</th>
                      <th className="py-3 px-4 font-bold">Vendor</th>
                      <th className="py-3 px-4 font-bold">Status</th>
                      <th className="py-3 px-4 font-bold text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-deepNavy-700/50">
                    {filteredDevices.map(dev => (
                      <tr key={dev.id || dev.ip} className="hover:bg-deepNavy-800/40">
                        <td className="py-3 px-4">
                          <div className="font-bold text-white">{dev.alias || dev.name}</div>
                          <div className="text-[10px] text-slate-400">{dev.name}</div>
                        </td>
                        <td className="py-3 px-4 font-mono">
                          <div className="text-cyan-300 font-bold">{dev.ip}</div>
                          <div className="text-[10px] text-slate-400">{dev.mac}</div>
                        </td>
                        <td className="py-3 px-4 text-slate-300">{dev.vendor}</td>
                        <td className="py-3 px-4">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                            dev.isBlocked ? 'bg-rose-950 text-rose-400' : 'bg-emerald-950 text-emerald-400'
                          }`}>
                            {dev.isBlocked ? 'Blocked' : 'Active'}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right">
                          <button
                            onClick={() => toggleBlockDevice(dev.ip)}
                            className={`px-2.5 py-1 rounded-lg text-xs font-bold ${
                              dev.isBlocked ? 'bg-emerald-600 text-white' : 'bg-rose-900/60 text-rose-300'
                            }`}
                          >
                            {dev.isBlocked ? 'Restore' : 'Block'}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

          </main>

          {/* CHROME APP INSTALLATION MODAL POPUP */}
          {showInstallModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
              <div className="dark-blue-card bg-deepNavy-900 border border-cyan-500/50 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl glow-cyan">
                
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg">
                      <svg className="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
                      </svg>
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">Install NetAdmin WebApp</h3>
                      <div className="text-xs text-cyan-300">Chrome PWA • Fast & Standalone</div>
                    </div>
                  </div>

                  <button
                    onClick={() => setShowInstallModal(false)}
                    className="w-8 h-8 rounded-full bg-deepNavy-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 bg-deepNavy-950/80 p-4 rounded-2xl border border-deepNavy-700">
                  <div className="font-semibold text-white">How to install in Google Chrome:</div>
                  <ol className="list-decimal pl-4 space-y-1.5">
                    <li>Open this page in <strong>Google Chrome</strong></li>
                    <li>Tap the <strong>three dots menu (⋮)</strong> at top right</li>
                    <li>Select <strong>"Install app"</strong> or <strong>"Add to Home screen"</strong></li>
                    <li>Confirm installation to access NetAdmin from your app drawer!</li>
                  </ol>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setShowInstallModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-deepNavy-800 hover:bg-deepNavy-700 text-slate-300 text-xs font-semibold"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => {
                      if (navigator.share) {
                        navigator.share({
                          title: 'NetAdmin WebApp',
                          text: 'WiFi connected local network admin dashboard',
                          url: window.location.href
                        }).catch(() => {});
                      } else {
                        navigator.clipboard?.writeText(window.location.href);
                        showToast("Webpage URL copied to clipboard!");
                      }
                      setShowInstallModal(false);
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-bold transition shadow-lg shadow-cyan-500/30"
                  >
                    Share / Copy URL
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Inspect Device Modal */}
          {selectedDevice && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="dark-blue-card bg-deepNavy-900 border border-deepNavy-700 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-start justify-between">
                  <div>
                    <h3 className="text-base font-bold text-white">{selectedDevice.alias || selectedDevice.name}</h3>
                    <div className="text-xs text-slate-400">{selectedDevice.vendor} • {selectedDevice.deviceType}</div>
                  </div>
                  <button
                    onClick={() => setSelectedDevice(null)}
                    className="w-8 h-8 rounded-full bg-deepNavy-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-deepNavy-950/80 rounded-2xl p-4 border border-deepNavy-700 space-y-2 text-xs">
                  <div className="flex justify-between">
                    <span className="text-slate-400">IP:</span>
                    <span className="font-mono text-cyan-300 font-bold">{selectedDevice.ip}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">MAC:</span>
                    <span className="font-mono text-slate-300">{selectedDevice.mac}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Latency:</span>
                    <span className="font-mono text-emerald-400">{selectedDevice.pingMs} ms</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">First Seen:</span>
                    <span className="text-slate-300">{selectedDevice.firstSeen}</span>
                  </div>
                </div>

                <div className="pt-2 flex items-center justify-end gap-3">
                  <button
                    onClick={() => {
                      toggleBlockDevice(selectedDevice.ip);
                      setSelectedDevice(null);
                    }}
                    className={`w-full py-2.5 rounded-xl text-xs font-bold ${
                      selectedDevice.isBlocked ? 'bg-emerald-600 text-white' : 'bg-rose-900/80 text-rose-200'
                    }`}
                  >
                    {selectedDevice.isBlocked ? 'Restore Access' : 'Block Device'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
